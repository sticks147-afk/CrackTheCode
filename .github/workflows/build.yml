name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libffi-dev zip unzip autoconf libtool pkg-config
          pip install buildozer "cython<3.0" "virtualenv==20.26.2" setuptools

      - name: Create Global Pip Constraint
        run: echo "pip<24.1" > pip_constraints.txt

      - name: Build APK with Buildozer
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/pip_constraints.txt
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CrackTheCode-APK
          path: bin/*.apk
